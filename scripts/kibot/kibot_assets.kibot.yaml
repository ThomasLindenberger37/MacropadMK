kibot:
  version: 1

outputs:
  - name: README_Schema
    type: svg_sch_print
    dir: assets
    options:
      output: "%f-schematic.svg"

  - name: README_Schema_PDF
    type: pdf_sch_print
    dir: assets
    options:
      output: "%f-schematic.pdf"

  - name: README_3D
    type: render_3d
    dir: assets
    options:
      # Prevents the job from failing due to missing 3D models
      # (Warnings remain, but the image is generated)
      # fatal_3d_error: false 
  
      output: "%f-board_3d.png"
      ray_tracing: true
      width: 1920
      height: 1080
